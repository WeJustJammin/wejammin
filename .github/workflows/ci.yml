name: CI
on:
  push:
    branches: [main]
    paths: ['**']
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['**']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  quality:
    name: Format, lint, type, and test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, wejammin]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm type-check
      - name: Run coverage and executable evidence gates
        run: pnpm test:coverage && pnpm test:evidence:s09
      - name: Verify system Google Chrome
        run: bash infra/workflows/verify-system-chrome.sh
      - name: Run browser and accessibility gates
        run: bash infra/workflows/run-browser-gates.sh
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-evidence-${{ github.run_attempt }}
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
  database:
    name: Database migrations, lint, and pgTAP
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, wejammin]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Verify database foundation
        run: pnpm db:ci
  build:
    name: Build immutable workspace artifacts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [quality, database]
    runs-on: [self-hosted, wejammin]
    timeout-minutes: 20
    env:
      DATABASE_RESULT: ${{ needs.database.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Build immutable workspace artifacts
        run: >-
          bash infra/workflows/build-immutable-artifacts.sh &&
          bash infra/workflows/verify-ci-release-gates.sh &&
          bash infra/workflows/write-ci-gate-evidence.sh
      - name: Enforce bundle and API p95 budgets
        run: |
          set -o pipefail; mkdir -p performance-evidence
          pnpm --silent bundle:check | tee performance-evidence/bundle-budget.json
          pnpm --silent performance:smoke | tee performance-evidence/api-p95-smoke.json
      - name: Upload immutable build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-build-${{ github.sha }}
          path: |
            apps/docs/dist/
            apps/web/dist/
            apps/worker/dist/
            ci-gate-evidence.json
            performance-evidence/
          if-no-files-found: error
          retention-days: 7
